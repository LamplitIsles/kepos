[versions]
agp = "8.13.2"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.12.0"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
compose = "1.11.4"
material3 = "1.4.0"
lifecycle = "2.10.0"
bareKit = "v0.2.2"
bouncyCastle = "1.86"
junit = "4.13.2"

# Every AndroidX version above is the newest release whose AAR metadata allows
# compileSdk 36 with Android Gradle Plugin 8.13.2. Newer AndroidX releases
# declare minCompileSdk=37 and minAndroidGradlePluginVersion=9.1.0.

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
bare-kit-kotlin = { module = "com.github.holepunchto.bare-kit-kotlin:bare-kit-kotlin", version.ref = "bareKit" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
