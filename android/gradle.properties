# The Gradle and Android plugin caches live in ~/.gradle; project output stays here.
# Small module: a bounded heap keeps one build inside the documented memory
# budget, and the Kotlin compiler runs in this JVM instead of a second daemon.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
