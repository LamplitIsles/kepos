[package]
name = "kepos-vpn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kepos Windows peer VPN backend: Wintun device, worklet supervision and identity state"

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Direct use of the IP Helper interface (peer /32 routes) and the system random
# source (`BCryptGenRandom`). Features follow exactly what `device.rs` and
# `random.rs` name.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
# The only component that is not repository-owned. It wraps Wintun and the
# Windows IP Helper interface; per-peer /32 routes are added by this crate.
tun-rs = { version = "2.8", default-features = false, features = ["address-management"] }
