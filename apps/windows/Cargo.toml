[workspace]
resolver = "2"
members = ["kepos-vpn", "kepos-tray"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Windows builds are cross-compiled from Linux with `cargo xwin`, which resolves
# the MSVC toolchain from its own cache. Keep release artifacts free of the
# Visual C++ redistributable.
[profile.release]
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
